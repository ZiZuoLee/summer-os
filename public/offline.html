<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#070a0f" />
    <meta name="robots" content="noindex" />
    <title>暂时离线 · Summer OS</title>
    <style>
      :root {
        color-scheme: dark;
        font-family:
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
        background: #070a0f;
        color: #f3f6fb;
      }

      * {
        box-sizing: border-box;
      }

      body {
        min-height: 100vh;
        min-height: 100svh;
        margin: 0;
        display: grid;
        place-items: center;
        padding: 24px;
        background:
          radial-gradient(
            circle at 15% 10%,
            rgb(34 211 238 / 14%),
            transparent 32rem
          ),
          radial-gradient(
            circle at 90% 90%,
            rgb(139 92 246 / 14%),
            transparent 30rem
          ),
          #070a0f;
      }

      main {
        width: min(100%, 560px);
        padding: clamp(28px, 7vw, 48px);
        border: 1px solid rgb(148 163 184 / 18%);
        border-radius: 28px;
        background: rgb(15 20 29 / 88%);
        box-shadow: 0 32px 80px rgb(0 0 0 / 38%);
      }

      .eyebrow {
        margin: 0 0 18px;
        color: #67e8f9;
        font-size: 0.75rem;
        font-weight: 800;
        letter-spacing: 0.18em;
        text-transform: uppercase;
      }

      h1 {
        margin: 0;
        font-size: clamp(2rem, 8vw, 3.5rem);
        line-height: 1.04;
        letter-spacing: -0.045em;
      }

      p {
        margin: 20px 0 0;
        color: #bac4d3;
        font-size: 1rem;
        line-height: 1.75;
      }

      button {
        min-height: 48px;
        margin-top: 30px;
        padding: 0 22px;
        border: 0;
        border-radius: 999px;
        color: #061015;
        background: linear-gradient(135deg, #67e8f9, #a78bfa);
        font: inherit;
        font-weight: 800;
        cursor: pointer;
      }

      button:focus-visible {
        outline: 3px solid #f8fafc;
        outline-offset: 4px;
      }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">Summer OS · Offline</p>
      <h1>网络暂时离开了</h1>
      <p>
        已经保存在这台设备上的打卡草稿仍会保留。重新联网后再提交即可；Summer OS
        不会把已认证页面、API 响应或健康数据存进离线缓存。
      </p>
      <button type="button" onclick="window.location.reload()">重新连接</button>
    </main>
  </body>
</html>
